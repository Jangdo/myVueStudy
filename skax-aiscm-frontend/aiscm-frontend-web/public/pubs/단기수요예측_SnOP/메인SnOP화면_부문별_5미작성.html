<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel" data-anchor-scroll>
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg">
                  <div class="cmnHeaderTitleArea">
                    <h2 class="cmnHeaderTitle lg">S&amp;OP 관리</h2>
                  </div>
                  <div class="cmnHeaderSideArea">
                    <div class="fieldsetItem">
                      <label class="title">S&amp;OP 버전</label>
                      <div class="dropdown md">
                        <button class="dropdownButton">26년도 6월</button>
                        <!-- root menu -->
                        <div class="dropdownMenu">
                          <ul class="dropdownMenuInner">
                            <li class="menuItem">
                              <button class="menuButton">26년도 6월</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">26년도 6월</button>
                            </li>
                          </ul>
                        </div>
                      </div>
                      <button type="button" class="button assistive outlined md" disabled>월마감</button>
                    </div>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <!-- tabs -->
                  <div class="tabs hideScroll">
                    <div class="tabButtons type1 md2" data-drag-scroll>
                      <div class="buttons">
                        <button class="tabButton" data-tab="tab1">전사 <span class="state">미작성</span></button>
                        <button class="tabButton isActive" data-tab="tab2">AT서비스 부문 <span class="state">미작성</span></button>
                        <button class="tabButton" data-tab="tab3">제조서비스 부문 <span class="state">미작성</span></button>
                        <button class="tabButton" data-tab="tab4">Enterprise서비스 부문 <span class="state">미작성</span></button>
                        <button class="tabButton" data-tab="tab5">Cloud서비스 부문 <span class="state">미작성</span></button>
                        <button class="tabButton" data-tab="tab6">CAIO <span class="state">미작성</span></button>
                        <button class="tabButton" data-tab="tab7">애커튼 <span class="state">미작성</span></button>
                      </div>
                    </div>

                    <!-- tabContent : 전사 -->
                    <div class="tabContent " data-content="tab1" data-anchor-scope>
                      전사
                    </div>
                    <!-- //tabContent : 전사 -->

                    <!-- tabContent : AT서비스 부문 -->
                    <div class="tabContent isActive" data-content="tab2" data-anchor-scope>
                      <section class="manageSnOp">
                        <div class="manageSnOpBody">
                          <div class="nodataBox typeReg bg border icon2">
                            <div class="innerBody">
                              <strong class="title">작성된 S&OP가 없습니다.</strong>
                              <span class="text">새로 작성하시겠어요?</span>
                              <div class="buttons">
                                <button type="button" class="button assistive outlined md">버전 생성</button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </section>
                    </div>
                    <!-- //tabContent : AT서비스 부문 -->

                    <!-- tabContent : 제조서비스 부문 -->
                    <div class="tabContent " data-content="tab3" data-anchor-scope>
                      제조서비스 부문
                    </div>
                    <!-- //tabContent : 제조서비스 부문 -->

                    <!-- tabContent : Enterprise서비스 부문 -->
                    <div class="tabContent " data-content="tab4" data-anchor-scope>
                      Enterprise서비스 부문
                    </div>
                    <!-- //tabContent : Enterprise서비스 부문 -->

                    <!-- tabContent : Cloud서비스 부문 -->
                    <div class="tabContent " data-content="tab5" data-anchor-scope>
                      Cloud서비스 부문
                    </div>
                    <!-- //tabContent : Cloud서비스 부문 -->

                    <!-- tabContent : CAIO -->
                    <div class="tabContent " data-content="tab6" data-anchor-scope>
                      CAIO
                    </div>
                    <!-- //tabContent : CAIO -->

                    <!-- tabContent : 애커튼 -->
                    <div class="tabContent " data-content="tab7" data-anchor-scope>
                      애커튼
                    </div>
                    <!-- //tabContent : 애커튼 -->
                  </div>
                  <!-- //tabs -->
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
      
      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat ">
        <div class="resizeHandle"></div>
        <div class="cmnHeader lg border panelHeader">
          <div class="cmnHeaderTitleArea">
            <strong class="cmnHeaderTitle lg">BR추정치 브리핑</strong>
          </div>
          <div class="cmnHeaderSideArea">
            <div class="buttons">
              <button type="button" class="button iconOnly buttonClose" onclick="closePanel('panelChat')">팝업 닫기</button>
            </div>
          </div>
        </div>
        <div class="panelBody">
          우측 영역
        </div>
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>

<script>
// TabMenu
document.querySelectorAll('.tabs').forEach(tab => {
  new TabMenu(tab);
});

// onload
window.addEventListener('DOMContentLoaded', () => {
  // panel size 조절
  new flexablePanel();

  // DragScroll
  DragScroll.init();
  
  // Dropdown
  Dropdown.initAll();

  // Accordion
  Accordion.init();

  // Dropdown / DropdownAnchorPlugin
  /* ==============================
    - Dropdown.initAll(); 이 후에 실행
    - scroll 영역 (.bodyPanel)에 data-anchor-scroll 추가
  ============================== */
  new DropdownAnchorPlugin({
    selector: '[data-anchor-dropdown]',
    offset: 20,
    duration: 400
  });
});
</script>
</html>
