<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel" data-anchor-scroll>
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg">
                  <div class="cmnHeaderTitleArea">
                    <div class="cmnHeaderTitlePreArea">
                      <button type="button" class="button transparent md iconOnly buttonBack">뒤로</button>
                    </div>
                    <h2 class="cmnHeaderTitle lg">AT 서비스부문 신규 버전 생성</h2>
                  </div>
                  <div class="cmnHeaderSideArea">
                    <div class="buttons">
                      <button type="button" class="button primary outlined md iconPre buttonPlus">어젠다 추가</button>
                      <button type="button" class="button assistive outlined md iconPre buttonPlus">액션 아이템 추가</button>
                      <i class="divider"></i>
                      <button type="button" class="button assistive outlined md">취소</button>
                      <button type="button" class="button assistive outlined md">저장</button>
                    </div>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <section class="manageSnOp">
                    <div class="dropdownAnchorWrapper" data-anchor-fixed>
                      <div class="dropdown xl" data-anchor-dropdown>
                        <button class="dropdownButton" disabled>어젠다 없음</button>
                        <!-- root menu -->
                        <div class="dropdownMenu">
                          <ul class="dropdownMenuInner">
                            <li class="menuItem">
                              <button class="menuButton" data-anchor-target="anchorArea1">부문별 이슈/대응 방안</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton" data-anchor-target="anchorArea2">AX 사업 리소스 수요 대응 방안</button>
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>

                    <div class="manageSnOpBody">
                      <div class="sectionRow">
                        <div class="nodataBox typeReg bg border icon2">
                          <div class="innerBody">
                            <span class="text">작성된 S&OP가 없습니다.</span>
                          </div>
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
      
      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat ">
        <div class="resizeHandle"></div>
        <div class="cmnHeader lg border panelHeader">
          <div class="cmnHeaderTitleArea">
            <strong class="cmnHeaderTitle lg">BR추정치 브리핑</strong>
          </div>
          <div class="cmnHeaderSideArea">
            <div class="buttons">
              <button type="button" class="button iconOnly buttonClose" onclick="closePanel('panelChat')">팝업 닫기</button>
            </div>
          </div>
        </div>
        <div class="panelBody">
          우측 영역
        </div>
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>

<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  // panel size 조절
  new flexablePanel();

  // Accordion
  Accordion.init();

  // Dropdown
  Dropdown.initAll();

  // Dropdown / DropdownAnchorPlugin
  /* ==============================
    - Dropdown.initAll(); 이 후에 실행
    - scroll 영역 (.bodyPanel)에 data-anchor-scroll 추가
  ============================== */
  new DropdownAnchorPlugin({
    selector: '[data-anchor-dropdown]',
    offset: 20,
    duration: 400
  });
});
</script>
</html>
