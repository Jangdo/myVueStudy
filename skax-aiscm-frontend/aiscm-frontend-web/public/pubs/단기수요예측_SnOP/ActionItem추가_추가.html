<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg column">
                  <div class="cmnHeaderTitlePreArea">
                    <button type="button" class="button transparent md2 iconOnly buttonBack">뒤로</button>
                  </div>
                  <div class="cmnHeaderTitleArea">
                    <h2 class="cmnHeaderTitle lg">액션 아이템 추가</h2>
                  </div>
                  <div class="cmnHeaderSideArea">
                    <div class="buttons">
                      <button type="button" class="button assistive outlined md">취소</button>
                      <button type="button" class="button assistive outlined md" disabled>저장</button>
                    </div>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <section class="section"> 
                    <div class="fieldsets">
                      <dl class="fieldset type1 xl">
                        <div class="col">
                          <dt><label class="required">현황</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="inputBox">
                                <input type="text" placeholder="Action Item 상세 내용을 입력해주세요." />
                                <button type="button" class="button iconOnly buttonClear">입력 삭제</button>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt><label class="required">유형</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">유형을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col flex3">
                          <dt><label class="required">귀속 조직</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">귀속 조직을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col flex1">
                          <dt><label class="required">귀속 연월</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">귀속 연월을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt><label class="required">원인</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="inputBox">
                                <input type="text" placeholder="Action Item 원인을 입력해주세요." />
                                <button type="button" class="button iconOnly buttonClear">입력 삭제</button>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt>
                            <label>해소 방안</label>
                            <div class="sideArea">
                              <div class="buttons">
                                <button type="button" class="button assistive outlined md iconPre buttonPlus">추가</button>
                              </div>
                            </div>
                          </dt>
                          <dd>
                            <div class="nodataBox typeReg bg border icon2">
                              <div class="innerBody">
                                <strong class="title">등록된 해소방안이 없습니다.</strong>
                                <span class="text">해소방안을 추가해주세요.</span>
                              </div>
                            </div>
                          </dd>
                        </div>
                      </dl>
                    </div>
                  </section>
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>

<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  // Dropdown
  Dropdown.initAll();
});
</script>
</html>
