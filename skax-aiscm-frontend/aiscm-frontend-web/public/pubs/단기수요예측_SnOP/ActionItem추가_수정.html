<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg column">
                  <div class="cmnHeaderTitlePreArea">
                    <button type="button" class="button transparent md2 iconOnly buttonBack">뒤로</button>
                  </div>
                  <div class="cmnHeaderTitleArea">
                    <h2 class="cmnHeaderTitle lg">액션 아이템 수정</h2>
                  </div>
                  <div class="cmnHeaderSideArea">
                    <div class="buttons">
                      <button type="button" class="button outlined md assistive">취소</button>
                      <button type="button" class="button outlined md assistive">저장</button>
                    </div>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <section class="section"> 
                    <div class="fieldsets">
                      <dl class="fieldset type1 xl">
                        <div class="col">
                          <dt><label class="required">현황</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="inputBox">
                                <input type="text" placeholder="Action Item 상세 내용을 입력해주세요." value="OOO 프로젝트 실주" />
                                <button type="button" class="button iconOnly buttonClear">입력 삭제</button>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt><label class="required">유형</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">유형을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton isSelected">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col flex3">
                          <dt><label class="required">귀속 조직</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">귀속 조직을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton isSelected">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col flex1">
                          <dt><label class="required">귀속 연월</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="dropdown">
                                <button class="dropdownButton">귀속 연월을 선택해주세요.</button>
                                <!-- root menu -->
                                <div class="dropdownMenu">
                                  <ul class="dropdownMenuInner">
                                    <li class="menuItem">
                                      <button class="menuButton isSelected">옵션1</button>
                                    </li>
                                    <li class="menuItem">
                                      <button class="menuButton">옵션2</button>
                                    </li>
                                  </ul>
                                </div>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt><label class="required">원인</label></dt>
                          <dd>
                            <div class="fieldBox xl">
                              <div class="inputBox">
                                <input type="text" placeholder="Action Item 원인을 입력해주세요." value="연간 UR 00% 수준으로 전체 가동 중이나, 1분기 계약 지연, 투자 확대로 연간 BR 61%, 계획비 12% 미달" />
                                <button type="button" class="button iconOnly buttonClear">입력 삭제</button>
                              </div>
                            </div>
                          </dd>
                        </div>
                        <div class="col">
                          <dt>
                            <label>해소 방안</label>
                            <div class="sideArea">
                              <div class="buttons">
                                <button type="button" class="button assistive outlined md iconPre buttonPlus">추가</button>
                              </div>
                            </div>
                          </dt>
                          <dd>
                            <dl class="fieldset type1 md2 border">
                              <div class="col">
                                <dt><label>유형</label></dt>
                                <dd>
                                  <div class="radios md2">
                                    <span class="itemRadio">
                                      <label><input type="radio">파이프라인</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">이동(부문내)</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">이동(부문간)</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">채용</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">육성</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">AGS</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">ATS</label>
                                    </span>
                                    <span class="itemRadio">
                                      <label><input type="radio">BP</label>
                                    </span>
                                  </div>
                                  <div class="floatingArea rightTop">
                                    <div class="buttons">
                                      <button type="button" class="button assistive outlined sm">삭제</button>
                                    </div>
                                  </div>
                                </dd>
                              </div>
                              <div class="col">
                                <dt><label>현황 요약</label></dt>
                                <dd>
                                  <div class="fieldBox md2 typeTextarea">
                                    <textarea cols="50" rows="3" placeholder="현황을 작성해주세요."></textarea>
                                  </div>
                                </dd>
                              </div>
                              <div class="col">
                                <dt><label>이미지 자료</label></dt>
                                <dd>
                                  <label class="fileUploadLabel icon1">
                                    <input type="file">
                                    <span class="labelText">파일을 드래그하거나 클릭하여 업로드 하세요.</span>
                                  </label>
                                </dd>
                              </div>
                              <div class="col">
                                <dt><label>이미지 자료</label></dt>
                                <dd>
                                  <div class="fileUploaded">
                                    <ul>
                                      <li>
                                        <span class="thumb"><img src="/assets/images/temp/actionItem_1.jpg"></span>
                                        <button type="button" class="button transparent iconOnly sm buttonDel">삭제</button>
                                      </li>
                                      <li>
                                        <span class="thumb"><img src="/assets/images/temp/actionItem_1.jpg" style="transform: rotate(90deg);"></span>
                                        <button type="button" class="button transparent iconOnly sm buttonDel">삭제</button>
                                      </li>
                                      <li>
                                        <span class="thumb"><img src="/assets/images/temp/actionItem_1.jpg"></span>
                                        <button type="button" class="button transparent iconOnly sm buttonDel">삭제</button>
                                      </li>
                                      <li>
                                        <span class="thumb"><img src="/assets/images/temp/actionItem_1.jpg"></span>
                                        <button type="button" class="button transparent iconOnly sm buttonDel">삭제</button>
                                      </li>
                                    </ul>
                                    <label class="fileUploadLabel icon1">
                                      <input type="file">
                                      <span class="labelText">이미지 업로드</span>
                                    </label>
                                  </div>
                                </dd>
                              </div>
                            </dl>
                          </dd>
                        </div>
                      </dl>
                    </div>
                  </section>
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>

<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  // Dropdown
  Dropdown.initAll();
});
</script>
</html>
