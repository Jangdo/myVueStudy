<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->

                <!-- bodyContents -->
                <div class="bodyContents">
                  <!-- tabs -->
                  <div class="tabs">
                    <div class="cmnHeader lg">
                      <div class="cmnHeaderTitleArea">
                        <h2 class="cmnHeaderTitle lg">승인</h2>
                      </div>
                    </div>
                    <div class="tabButtons type3 rightTop">
                      <div class="buttons">
                        <button class="tabButton isActive" data-tab="tab1">팀원별 보기</button>
                        <button class="tabButton" data-tab="tab2">프로젝트별 보기</button>
                      </div>
                    </div>

                    <!-- tabContent 1 : 팀원별 보기 -->
                    <div class="tabContent isActive" data-content="tab1">
                      <div class="tabs">
                        <div class="tabButtons type1 md2 mb2">
                          <div class="buttons">
                            <button class="tabButton isActive" data-tab="tab1Inner1">승인 필요</button>
                            <button class="tabButton" data-tab="tab1Inner2">처리 결과</button>
                          </div>
                        </div>

                        <!-- tabContent 1 inner 1 : 승인 필요 -->
                        <div class="tabContent isActive" data-content="tab1Inner1">
                          <section class="section">
                            팀원별 보기 > 승인 필요
                          </section>
                        </div>
                        <!-- //tabContent 1 inner 1 : 승인 필요 -->

                        <!-- tabContent 1 inner 2 : 처리 결과 -->
                        <div class="tabContent " data-content="tab1Inner1">
                          <section class="section">
                            팀원별 보기 > 처리 결과
                          </section>
                        </div>
                        <!-- //tabContent 1 inner 2 : 처리 결과 -->
                      </div>
                    </div>
                    <!-- //tabContent 1 : 팀원별 보기 -->

                    <!-- tabContent 2 : 프로젝트별 보기 -->
                    <div class="tabContent " data-content="tab2">
                      <div class="tabs">
                        <div class="tabButtons type1 md2 mb2">
                          <div class="buttons">
                            <button class="tabButton isActive" data-tab="tab2Inner1">승인 필요</button>
                            <button class="tabButton" data-tab="tab2Inner2">처리 결과</button>
                          </div>
                        </div>

                        <!-- tabContent 2 inner 1 : 승인 필요 -->
                        <div class="tabContent isActive" data-content="tab2Inner1">
                          <section class="section">
                            프로젝트별 > 승인 필요
                          </section>
                        </div>
                        <!-- //tabContent 2 inner 1 : 승인 필요 -->

                        <!-- tabContent 2 inner 2 : 처리 결과 -->
                        <div class="tabContent " data-content="tab2Inner1">
                          <section class="section">
                            프로젝트별 > 처리 결과
                          </section>
                        </div>
                        <!-- //tabContent 2 inner 2 : 처리 결과 -->
                      </div>
                    </div>
                    <!-- //tabContent 2 : 프로젝트별 보기 -->
                  </div>
                  <!-- //tabs -->
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->

      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat ">
        <div class="resizeHandle"></div>
        <div class="cmnHeader lg border panelHeader">
          <div class="cmnHeaderTitleArea">
            <strong class="cmnHeaderTitle lg">BR추정치 브리핑</strong>
          </div>
          <div class="cmnHeaderSideArea">
            <div class="buttons">
              <button type="button" class="button iconOnly buttonClose" onclick="closePanel('panelChat')">팝업 닫기</button>
            </div>
          </div>
        </div>
        <div class="panelBody">
          우측 영역
        </div>
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>

<script>
// TabMenu
document.querySelectorAll('.tabs').forEach(tab => {
  new TabMenu(tab);
});

// onload
window.addEventListener('DOMContentLoaded', () => {
  // Accordion
  Accordion.init();

  // Dropdown
  Dropdown.initAll();
});
</script>
</html>
