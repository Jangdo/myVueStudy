<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg">
                  <div class="cmnHeaderTitleArea">
                    <h2 class="cmnHeaderTitle lg">프로젝트 정보</h2>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <section class="section flex1">
                    <div class="cmnHeader md">
                      <div class="cmnHeaderTitleArea">
                        <strong class="cmnHeaderTitle">담당 팀원</strong>
                      </div>
                      <div class="cmnHeaderSideArea">
                        <div class="buttons">
                          <button type="button" class="button outlined assistive md iconPre buttonUpload">PROMIS 보내기</button>
                          <button type="button" class="button outlined assistive md iconPre buttonDownload">엑셀 다운로드</button>
                          <button type="button" class="button outlined primary md iconPre buttonAi">AI 추천 조건 설정</button>
                        </div>
                      </div>
                    </div>

                    <!-- card -->
                    <div class="card type2 projectInforTeamMemeber">
                      <div class="cmnHeader">
                        <div class="cmnHeaderTitleArea">
                          <!-- ==============================
                            #클래스 설명
                              - 활성 : .button.filter + .isActive
                          ============================== -->
                          
                          <div class="buttons sm">
                            <button type="button" class="button filter sm isActive">전체</button>
                            <button type="button" class="button filter sm">미배정</button>
                          </div>
                          <div class="radios">
                            <label class="chckboxSwitch">
                              <span class="labelText">Skill-set 펼치기</span>
                              <input type="checkbox" data-check-toggle-item-button="skill" data-display="table-cell" />
                            </label>
                            <label class="chckboxSwitch">
                              <span class="labelText">월별 MM 펼치기</span>
                              <input type="checkbox" data-check-toggle-item-button="mtm" data-display="table-cell" />
                            </label>
                          </div>
                        </div>
                        <div class="cmnHeaderSideArea">
                          <div class="buttons sm">
                            <div class="col">
                              <button type="button" class="button assistive outlined sm">행 추가</button>
                              <button type="button" class="button assistive outlined sm">행 삭제</button>
                              <button type="button" class="button assistive outlined sm">행 복사</button>
                            </div>
                            <div class="col">
                              <button type="button" class="button primary solid sm">승인 요청</button>
                            </div>
                          </div>
                        </div>
                      </div>
                      
                      <div class="tables tablesScrollX">
                        <!-- case / table : 역할 없음 -->
                        <div class="nodataBox typeAdd">
                          <div class="innerBody">
                            <button type="button" class="button iconTop buttonAddCircle">역할을 추가해주세요</button>
                          </div>
                        </div>
                        <!-- //case / table : 역할 없음 -->
                        
                        <hr />
                        
                        <!-- case / table : AI추천 로딩 -->
                        <div class="nodataBox typeLoading">
                          <div class="innerBody">
                            <i class="spinner"></i>
                            <span class="title">AI 추천</span>
                            <span class="text">역할에 적합한 인재를 찾는 중입니다.</span>
                          </div>
                        </div>
                        <!-- //case / table: AI추천 로딩 -->
                      </div>
                    </div>
                    <!-- //card -->
                  </section>
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
      
      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat ">
        <div class="resizeHandle"></div>
        우측 영역
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>

<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  // Tooltip
  new Tooltip();

  // panel size 조절
  new flexablePanel();

  // table x scroll
  new TableScroller({
    className: 'tablesScrollX'
  });

  // switch toggle
  initCheckToggleItems();

  // Accordion
  Accordion.init();

  // Dropdown
  Dropdown.initAll();
});
</script>
</html>
