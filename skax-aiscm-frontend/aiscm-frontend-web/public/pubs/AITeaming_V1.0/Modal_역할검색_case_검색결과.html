<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                본문
                <!-- //본문 : 여기서부터 페이지 시작 -->

                <!-- modal :  -->
                <div class="dimmed">
                  <div class="modal sm hgtMd">
                    <div class="cmnHeader modalHeader">
                      <div class="cmnHeaderTitleArea">
                        <h1 class="cmnHeaderTitle">역할 검색</h1>
                      </div>
                      <div class="cmnHeaderSideArea">
                        <div class="buttons">
                          <button type="button" class="button iconOnly buttonClose">팝업 닫기</button>
                        </div>
                      </div>
                    </div>
                    
                    <!-- modalBody : 본문 -->
                    <div class="modalBody">
                      <div class="searchFilter">
                        <div class="row">
                          <div class="fieldBox lg">
                            <div class="inputBox">
                              <input type="text" placeholder="역할명 검색" />
                              <button type="button" class="button iconOnly buttonClear">입력 삭제</button>
                            </div>
                            <div class="sideArea">
                              <button type="button" class="button iconOnly buttonSearch">검색</button>
                            </div>
                          </div>
                        </div>
                      </div>
                      
                      <div class="tables flex1">
                        <div class="cmnHeader md">
                          <div class="cmnHeaderTitleArea">
                            <h2 class="cmnHeaderTitle sm">역할 목록<span class="cmnHeaderCount"><strong class="cmnHeaderCountNumber2">(56건)</strong></span></h2>
                          </div>
                        </div>
                        
                        <!-- case : 검색결과 -->
                        <table class="table type2 stripe">
                          <colgroup>
                            <col style="width: 40px" />
                            <col style="width: 60px" />
                            <col style="width: 40%" />
                            <col style="width: auto" />
                          </colgroup>
                          <thead>
                            <tr>
                              <th>선택</th>
                              <th>No</th>
                              <th>역할그룹</th>
                              <th>역할명</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr>
                              <td><input type="radio" /></td>
                              <td>9000</td>
                              <td>프로젝트 관리</td>
                              <td>프로젝트 관리자</td>
                            </tr>

                            <tr>
                              <td><input type="radio" /></td>
                              <td>9000</td>
                              <td>프로젝트 관리</td>
                              <td>프로젝트 관리자</td>
                            </tr>
                            <tr>
                              <td><input type="radio" /></td>
                              <td>9000</td>
                              <td>프로젝트 관리</td>
                              <td>프로젝트 관리자</td>
                            </tr>
                          </tbody>
                        </table>
                        <!-- //case : 검색결과 -->
                      </div>
                    </div>
                    <!-- //modalBody : 본문 -->

                    <div class="modalFooter">
                      <div class="buttons">
                        <button type="button" class="button assistive outlined xl">취소</button>
                        <button type="button" class="button primary solid xl">선택</button>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- //modal :  -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>
</html>
