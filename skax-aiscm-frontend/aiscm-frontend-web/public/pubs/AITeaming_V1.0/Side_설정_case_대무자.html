<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                <div class="cmnHeader lg">
                  <div class="cmnHeaderTitleArea">
                    <h2 class="cmnHeaderTitle lg">NOVA 개발 1팀 현황</h2>
                  </div>
                  <div class="cmnHeaderSideArea">
                    <div class="buttons">
                      <a href="#none" class="buttonLink">우리팀 인력 투입현황 보기</a>
                    </div>
                  </div>
                </div>

                <!-- bodyContents -->
                <div class="bodyContents">
                  <section class="section">
                    <div class="asidePageSetting">
                      <div class="cardGroup">
                        <div class="card type2">
                          <div class="cmnHeader">
                            <div class="cmnHeaderTitleArea">
                              <strong class="cmnHeaderTitle">알림 설정</strong>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="cardGroup">
                        <div class="card type2">
                          <div class="cmnHeader">
                            <div class="cmnHeaderTitleArea">
                              <strong class="cmnHeaderTitle">대무자 설정</strong>
                            </div>
                          </div>
                          <!-- case / 대무자 : nodata -->
                          <div class="nodataBox typeAdd">
                            <div class="innerBody">
                              <button type="button" class="button iconTop buttonAddCircle">대무자를 추가해주세요</button>
                            </div>
                          </div>
                          <!-- //case / 대무자 : nodata -->

                          <!-- case / 대무자 : 지정1 -->
                          <div class="personLabel sm bg">
                            <span class="thumb"><img src="/assets/images/temp/profile_64.png" /></span>
                            <div class="infors">
                              <span class="name">홍수진</span>
                              <span class="role">NOVA 개발2팀 팀장</span>
                            </div>
                            <div class="utils">
                              <button type="button" class="button transparent iconOnly buttonDelete">삭제</button>
                            </div>
                          </div>
                          <!-- //case / 대무자 : 지정1 -->

                          <!-- case / 대무자 : 지정2 -->
                          <div class="personLabel sm bg">
                            <span class="thumb"><img src="/assets/images/common/noimage_profile.png" /></span>
                            <div class="infors">
                              <span class="name">홍수진</span>
                              <span class="role">NOVA 개발2팀 팀장</span>
                            </div>
                            <div class="utils">
                              <button type="button" class="button transparent iconOnly buttonDelete">삭제</button>
                            </div>
                          </div>
                          <!-- //case / 대무자 : 지정2 -->

                          <!-- case / 대무자 : 사용자가 다른사용자  에 의해 대무자로 선정된 상태 -->
                          <div class="personLabel sm bg">
                            <span class="thumb lock"></span>
                            <div class="infors">
                              <span class="note">(팀장명)의 대무자로 설정되어 있습니다.</span>
                            </div>
                          </div>
                          <!-- //case / 대무자 : 사용자가 다른사용자에 의해 대무자로 선정된 상태 -->
                        </div>
                      </div>
                    </div>
                  </section>
                </div>
                <!-- //bodyContents -->
                
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>
</html>
