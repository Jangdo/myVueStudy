<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                본문
                <!-- //본문 : 여기서부터 페이지 시작 -->

                <!-- modal : 필터 설정 -->
                <div class="dimmed">
                  <div class="modal xs">
                    <div class="cmnHeader modalHeader">
                      <div class="cmnHeaderTitleArea">
                        <h1 class="cmnHeaderTitle">OO 사업 기회</h1>
                      </div>
                      <div class="cmnHeaderSideArea">
                        <div class="buttons">
                          <button type="button" class="button iconOnly buttonClose">팝업 닫기</button>
                        </div>
                      </div>
                    </div>
                    
                    <!-- modalBody : 본문 -->
                    <div class="modalBody">
                      <div class="section">
                        <dl class="dlist type5">
                          <div class="row">
                            <dt>영업 단계</dt>
                            <dd><span class="badge sales case1">lead</span></dd>
                          </div>
                          <div class="row">
                            <dt>리스크</dt>
                            <dd>상</dd>
                          </div>
                          <div class="row">
                            <dt>유형</dt>
                            <dd>SI-AD</dd>
                          </div>
                          <div class="row">
                            <dt>입찰일</dt>
                            <dd>26.04.30</dd>
                          </div>
                          <div class="row">
                            <dt>계약 예정일</dt>
                            <dd>26.05.12</dd>
                          </div>
                          <div class="row">
                            <dt>사업 기간</dt>
                            <dd>26.05.18 ~ 27.05.17 </dd>
                          </div>
                          <div class="row">
                            <dt>account manager</dt>
                            <dd>김이름 매니저</dd>
                          </div>
                          <div class="row">
                            <dt>Business 조직</dt>
                            <dd>팀</dd>
                          </div>
                          <div class="row">
                            <dt>총 사업 규모</dt>
                            <dd>30,000,000</dd>
                          </div>
                        </dl>
                        <div class="card type3">
                          <dl class="dlist type2 md">
                            <div class="row">
                              <dt>A팀</dt>
                              <dd><span class="amount"><span class="number lg">9,990,000</span><span class="unit sm">원</span></span></dd>
                            </div>
                            <div class="row">
                              <dt>A팀</dt>
                              <dd><span class="amount"><span class="number lg">90,000</span><span class="unit sm">원</span></span></dd>
                            </div>
                            <div class="row">
                              <dt>A팀</dt>
                              <dd><span class="amount"><span class="number lg">109,990,000</span><span class="unit sm">원</span></span></dd>
                            </div>
                          </dl>
                        </div>
                      </div>
                    </div>
                    <!-- //modalBody : 본문 -->
                  </div>
                </div>
                <!-- //modal : 필터 설정 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>
</html>
