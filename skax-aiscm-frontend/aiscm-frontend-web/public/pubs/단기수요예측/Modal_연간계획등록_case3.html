<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                본문
                <!-- //본문 : 여기서부터 페이지 시작 -->

                <!-- modal : 필터 설정 -->
                <div class="dimmed">
                  <div class="modal xs">
                    <div class="cmnHeader modalHeader">
                      <div class="cmnHeaderTitleArea">
                        <h1 class="cmnHeaderTitle">연간 계획 등록</h1>
                      </div>
                      <div class="cmnHeaderSideArea">
                        <div class="buttons">
                          <button type="button" class="button iconOnly buttonClose">팝업 닫기</button>
                        </div>
                      </div>
                    </div>
                    
                    <!-- modalBody : 본문 -->
                    <div class="modalBody">
                      <!-- case 3 : 파일 업로드 완료시 ============================== -->
                      <div class="fileUploadBox">
                        <div class="innerHeader">
                          <strong class="innerTitle">파일 첨부</strong>
                          <span class="innerText">엑셀(.xlsx, .xls) 파일만 업로드 가능합니다. 최대 10MB.</span>
                        </div>
                        <div class="innerBody">
                          <dl class="dlist type5">
                            <div class="row">
                              <dt>파일명</dt>
                              <dd>
                                <div class="itemFileBox mono">
                                  <span class="itemFile mono xlsx">AI index 2025 주요내용과 시사점을 담은 Report</span>
                                  <button type="button" class="button transparent xs iconOnly buttonDelete8">삭제</button>
                                </div>
                              </dd>
                            </div>
                            <div class="row">
                              <dt>등록자</dt>
                              <dd>홍길동 (PMO2팀)</dd>
                            </div>
                          </dl>
                        </div>
                      </div>
                      <!-- //case 3 : 파일 업로드 완료시 ============================== -->
                    </div>
                    <!-- //modalBody : 본문 -->

                    <div class="modalFooter">
                      <div class="buttons">
                        <button type="button" class="button primary solid xl">등록</button>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- //modal : 필터 설정 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
    </div>
  </div>
</body>
</html>
