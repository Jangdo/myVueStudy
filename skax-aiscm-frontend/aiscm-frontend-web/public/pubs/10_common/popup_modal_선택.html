<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
  <script src="/assets/js/uiCommon.js"></script> <!-- 퍼블리싱 ui 참고를 위한 파일 / 개발에서는 가져가지 마세요. -->
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb -->
      <aside class="aside asideCollapsed lnb">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>
          </div>
        </div>
      </aside>
      <!-- //layout : lnb -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                본문
                <!-- //본문 : 여기서부터 페이지 시작 -->

                <!-- modal :  -->
                <div class="dimmed">
                  <div class="modal xxs ofv">
                    <div class="cmnHeader modalHeader">
                      <div class="cmnHeaderTitleArea">
                        <h1 class="cmnHeaderTitle">행 복사</h1>
                      </div>
                      <div class="cmnHeaderSideArea">
                        <div class="buttons">
                          <button type="button" class="button iconOnly buttonClose">팝업 닫기</button>
                        </div>
                      </div>
                    </div>
                    
                    <!-- modalBody : 본문 -->
                    <div class="modalBody">
                      <div class="dropdown lg">
                        <button class="dropdownButton">1</button>
                        <!-- root menu -->
                        <div class="dropdownMenu">
                          <ul class="dropdownMenuInner">
                            <li class="menuItem">
                              <button class="menuButton">1</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">2</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">3</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">4</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">5</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">6</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">7</button>
                            </li>
                            <li class="menuItem">
                              <button class="menuButton">8</button>
                            </li>
                          </ul>
                        </div>
                      </div>
                    </div>
                    <!-- //modalBody : 본문 -->

                    <div class="modalFooter">
                      <div class="buttons">
                        <button type="button" class="button assistive outlined xl">취소</button>
                        <button type="button" class="button primary solid xl">선택</button>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- //modal :  -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
      
      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat ">
        <div class="resizeHandle"></div>
        <div class="cmnHeader lg border panelHeader">
          <div class="cmnHeaderTitleArea">
            <strong class="cmnHeaderTitle lg">BR추정치 브리핑</strong>
          </div>
          <div class="cmnHeaderSideArea">
            <div class="buttons">
              <button type="button" class="button iconOnly buttonClose" onclick="closePanel('panelChat')">팝업 닫기</button>
            </div>
          </div>
        </div>
        <div class="panelBody">
          우측 영역
        </div>
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>

<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  // Dropdown
  Dropdown.initAll();
});
</script>
</html>
