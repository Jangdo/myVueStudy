<!doctype html>
<html lang="ko-KR">
<head>
  <title>AI SCM 퍼블리싱</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/assets/css/globals.css">
  
</head>
<body>
  <div class="viewportFill">
    <div class="workspace">
      <!-- layout : lnb : close -->
      <aside class="aside asideCollapsed lnb" style="">
        <div class="collapsedColumn">
          <div>
            <div class="collapsedTop">
              <button type="button" class="collapsedLogoBtn" aria-label="홈" title="SCM">
                <span class="collapsedLogoMark" aria-hidden>
                  <i class="IconAxgenticWireCollapsed">/</i>
                </span>
              </button>
              <button type="button" class="toggleBtn">
                <i class="IconPanelExpand">/</i>
              </button>
            </div>

            <!-- 여기서부터 ================================================== -->
            <div class="middleStack">
              <div class="lnbMenuBody">
                <div class="lnbCollapseMenu">
                  <div class="lnbCollapseMenuHeader">
                    <i class="icon lnbIcon snop"></i>
                  </div>
                  <div class="lnbCollapseMenuBody">
                    <span class="menuCount">20</span>
                  </div>
                </div>
              </div>
            </div>
            <!-- //여기서부터 ================================================== -->

          </div>
        </div>
      </aside>
      <!-- layout : lnb : close -->

      <!-- layout : lnb : open -->
      <aside class="aside asideOpen" data-scm-open="true" aria-label="SCM LNB">
        <div class="innerOpen">
          <div class="topRow">
            <div class="logoRow">
              <div class="logoMark" aria-hidden>
                <img alt="" loading="lazy" width="28" height="26" decoding="async" data-nimg="1" style="color:transparent" src="/axgenticwire-mark.svg">
              </div>
              <div class="logoText">
                <span class="logoTitle" aria-label="AXGENTIC WIRE">
                  <span class="brandWordmark" aria-hidden>
                    <span class="brandAxgentic">AXGENTIC</span>
                    <span class="brandWire">WIRE</span>
                  </span>
                </span>
                <span class="logoSub">AI SCM</span>
              </div>
            </div>
            <button type="button" class="toggleBtn" aria-label="사이드바 접기">
              <svg width="16" height="16" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="1" y="2" width="12" height="10" rx="1.5" stroke="currentColor" stroke-width="1.35"></rect><path d="M5 2v10" stroke="currentColor" stroke-width="1.35"></path></svg>
            </button>
          </div>

          <!-- 여기서부터 ================================================== -->
          <div class="middleStack">
            <div class="lnbMenuSection">
              <div class="lnbMenuHeader">
                <div class="titleArea">
                  <strong class="title iconTitle lnbIcon snop">S&OP</strong>
                </div>
              </div>
              <div class="lnbMenuBody">
                <div class="lnbOutterBox">
                  <ul class="lnbMenu type1">
                    <li><button type="button" class="lnbMenuButton">BR 현황</button></li>
                    <li><button type="button" class="lnbMenuButton isActive">Resource 현황</button></li>
                    <li><button type="button" class="lnbMenuButton">채용 및 육성</button></li>
                    <li><button type="button" class="lnbMenuButton">5-Tier</button></li>
                    <li><button type="button" class="lnbMenuButton">S&amp;OP</button></li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <!-- //여기서부터 ================================================== -->

          <div class="spacer"></div>

          <div class="footerLinks">
            footerLinks
          </div>

          <div class="profileBlock">
            profileBlock
          </div>
        </div>
      </aside>
      <!-- //layout : lnb : open -->

      <!-- layout : main -->
      <div class="mainColumn">
        <div class="mainFrame">
          <!-- root -->
          <div class="root">
            <div class="bodyPanel">
              <div class="stack">

                <!-- 본문 : 여기서부터 페이지 시작 -->
                본문
                <!-- //본문 : 여기서부터 페이지 시작 -->
                
              </div>
            </div>
          </div>
          <!-- //root -->
        </div>
      </div>
      <!-- //layout : main -->
      
      <!-- layout : right panel Area -->
      <!-- ==============================
        #상태 open : .panel.isOpen
      ============================== -->
      <div class="panel right panelChat isOpen">
        <div class="resizeHandle"></div>
        <div class="cmnHeader lg border panelHeader">
          <div class="cmnHeaderTitleArea">
            <strong class="cmnHeaderTitle lg">BR추정치 브리핑</strong>
          </div>
          <div class="cmnHeaderSideArea">
            <div class="buttons">
              <button type="button" class="button iconOnly buttonClose" onclick="closePanel('panelChat')">팝업 닫기</button>
            </div>
          </div>
        </div>
        <div class="panelBody">
          우측 영역
        </div>
      </div>
      <!-- //layout : right panel Area -->
    </div>
  </div>
</body>
</html>
