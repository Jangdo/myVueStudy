<h2 class="l_title">기타</h2>
<p class="l_text">실제 사용될수 있거나 사용 될 것 같아 만든, 하지만 사용되지 않는.</p>
<div class="l_article">
  <h3 class="l_title">range</h3>
  <div class="l_body">
    <div class="l_row">
      <div class="">
        <div class="aa">
          <input type="range" id="aaa" />
          <output id="out" for="aaa"></output>
        </div>
        <div class="aa">
          <label for="temp">온도 설정:</label><br />
          <input type="range" id="temp" max="36" min="18" name="temp" list="markers" step="0.5" />
          <datalist id="markers">
            <option value="22"></option>
            <option value="24"></option>
            <option value="26"></option>
            <option value="28"></option>
            <option value="30"></option>
          </datalist>
        </div>
        <div class="aa">
          <div>
            <label for="temp1">온도 설정 1:</label><br>
            <input type="range" id="temp1" max="36" min="18" name="temp1" list="markers" step="0.5" />
          </div>
          <div>
            <label for="temp2">온도 설정 2:</label><br>
            <input type="range" id="temp2" max="36" min="18" name="temp2" list="markers" step="0.5" />
          </div>
          <datalist id="markers">
            <option value="22"></option>
            <option value="24"></option>
            <option value="26"></option>
            <option value="28"></option>
            <option value="30"></option>
          </datalist>
        </div>
        <div class="aa">
          <label for="temp">온도 설정:</label><br />
          <input type="range" id="temp" max="100" min="0" name="temp" list="markers" step="5" class="test" />
          <datalist id="markers" class="test">
            <option label="꽁꽁" value="0"></option>
            <option label="썰렁" value="25"></option>
            <option label="적절" value="50"></option>
            <option label="따듯" value="75"></option>
            <option label="후끈" value="100"></option>
          </datalist>
        </div>
      </div>
    </div>
  </div>
</div>
