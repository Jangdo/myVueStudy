<script>
// onload
window.addEventListener('DOMContentLoaded', () => {
  loadPubLibrary();
});

// import html
async function loadPubLibrary() {
  const elements = document.querySelectorAll('[data-include]');
  for (const el of elements) {
    const file = el.dataset.include;
    const response = await fetch(file);
    el.innerHTML = await response.text();
  }

  initGuidePage();
  initOnoload();
  initDragDrop();
  initSwiper();
}

// init : guide page 전용
const initGuidePage = () => {
  // TabMenu
  document.querySelectorAll('.tabs').forEach(tab => {
    new TabMenu(tab);
  });

  // input range
  document.querySelectorAll(".slider").forEach((el) => {
    new RangeSlider(el);
  });
}

// onloade
const initOnoload = () => {
  // Tooltip
  // new Tooltip();
  new Tooltip({
      offset: 0,
      viewportPadding: 0,
      hideDelay: 200
  });
  new TooltipMember();
  new TooltipClone();
  new TooltipArray();

  // TableScroller
  new TableScroller({
    className: 'tablesScrollX'
  });

  // DragScroll
  DragScroll.init();

  // Accordion
  Accordion.init();

  // Dropdown
  Dropdown.initAll();

  // Dropdown / DropdownAnchorPlugin
  /* ==============================
    - Dropdown.initAll(); 이 후에 실행
    - scroll 영역 (.bodyPanel)에 data-anchor-scroll 추가
  ============================== */
  new DropdownAnchorPlugin({
    selector: '[data-anchor-dropdown]',
    duration: 400,
    offset: 80,
    activeOffset: 60,
  });

  // Dropdown / 선택 reset
  /* ==============================
    - Dropdown.initAll(); 이 후에 실행
    - isSelected 제거
    - placeholder 복구
    - change 이벤트 발생
  ============================== */
  const dropdownSet = Dropdown.getInstance(
    document.querySelector('.dropdownSet.dropdown')
  );
  dropdownSet.select(null,{
    unselect:true
  });
  
  // Dropdown / 옵션 동적 추가
  /* ==============================
    - Dropdown.initAll(); 이 후에 실행
    - 버튼 width 갱신
    - Event Delegation으로 클릭 가능
    - 별도 init() 불필요
  ============================== */

  // 옵션 추가
  const dropdownNewMenu = document.querySelector('.dropdownNewMenu .dropdownMenuInner');
  dropdownNewMenu.insertAdjacentHTML(
    'beforeend',
    `
    <li class="menuItem">
      <button class="menuButton" data-value="option3">
        옵션 추가
      </button>
    </li>
    `
  );
  
  // 옵션 전체 변경
  const dropdownNewMenu2 = document.querySelector('.dropdownNewMenu2 .dropdownMenuInner');
  dropdownNewMenu2.innerHTML = `
    <li class="menuItem">
      <button class="menuButton">사과</button>
    </li>
    <li class="menuItem">
      <button class="menuButton isSelected">바나나</button>
    </li>
    <li class="menuItem">
      <button class="menuButton">포도 긴텍스트 긴텍스트 긴텍스트</button>
    </li>
  `;
}

// dragDrop
const initDragDrop = () => {
  // dragDrop
  const manager = new DragDropManager({
    root: document.querySelector('dragDropArea'),
    animation : false,
    animationDuration : 200,
    returnButton : true,
    returnButtonText : "버리기",
  
    canDrop(item, area){
      return (area.dataset.ddmDrop !=='disabled');
    },
    onChange(data){
      console.log('CHANGE', data);
    },
    onDrop(item){
      console.log('DROP', item);
    },
    onDelete(item){
      console.log('DELETE', item);
    },
    onReturn(item){
      console.log('RETURN', item);
    },
    canDrop(item, area) {
      // return !area.classList.contains('disabled');
      return area.dataset.ddmDrop !== 'disabled';
    },
  });
  manager.init();
  
  // dragDrop / 테스트용
  window.ddm = manager;
}

// swiper
const initSwiper = () => {
  // swiper
  const swiper = new Swiper('.swiper1', {
    // Optional parameters
    loop: false,
    slidesPerView: 4,
    spaceBetween: 20,
    slidesPerGroup: 4,

    // If we need pagination
    pagination: {
      el: '.swiper-pagination',
      type: "fraction"
    },

    // Navigation arrows
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },

    // And if we need scrollbar
    scrollbar: {
      el: '.swiper-scrollbar',
    },
  });

  const swiper2 = new Swiper('.swiper2', {
    // Optional parameters
    loop: false,
    slidesPerView: 4,
    spaceBetween: 10,
    slidesPerGroup: 4,

    pagination: {
      el: ".swiper-pagination",
      clickable: true,
      dynamicBullets: true
    },

    // Navigation arrows
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
  });

  const swiper3 = new Swiper('.swiper3', {
    direction: "vertical",
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
      dynamicBullets: false
    }
  });

  // 
  const swiperExA1 = new Swiper('.swiperExA1', {
    direction: "vertical",
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
      dynamicBullets: false
    }
  });

  const swiperExA2 = new Swiper('.swiperExA2', {
    // Optional parameters
    loop: false,
    slidesPerView: 4,
    spaceBetween: 10,
    slidesPerGroup: 4,

    pagination: {
      el: ".swiper-pagination",
      clickable: true,
      dynamicBullets: true
    },

    // Navigation arrows
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
  });

  const swiperTabBtn = new Swiper('.swiperTabButtons', {
    slidesPerView: 'auto',
    spaceBetween: 0,
    freeMode: true,
    watchSlidesProgress: true,
  });
  const swiperTabBody = new Swiper('.swiperTabBody', {
    effect: "fade",
    autoHeight: true,
    allowTouchMove: false,
    thumbs: {
      swiper: swiperTabBtn,
    },
  });
}
</script>
